aid: draftwise
name: DraftWise
description: 'DraftWise is an AI-powered contract drafting, review, and negotiation platform for
  legal teams that grounds generative drafting in a firm''s own precedent, deal history, clauses,
  playbooks, and guidance. It works primarily as a Microsoft Word add-in and connects to document
  management systems including iManage and NetDocuments, plus market intelligence from EDGAR
  filings. Products include Deal Table contract intelligence, Playbook Studio, a Knowledge Console,
  and an enterprise Deal Context API that surfaces transactional deal history and precedent to
  agents and applications. DraftWise serves Big Law, mid-market firms, and in-house teams across
  ad tech, defense, investment funds, life sciences, real estate, and SaaS. The company is SOC 2
  Type II and ISO 27001 certified, GDPR compliant, and holds UK Cyber Essentials Plus. Backed by
  Index Ventures.'
